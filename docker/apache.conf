<VirtualHost *:80>
    DocumentRoot /var/www/html/fleetco/fleetco

    <Directory /var/www/html/fleetco/fleetco>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny direct access to plugins and vendor directories
    <DirectoryMatch "^/var/www/html/fleetco/(vendor|fleetco/plugins/dompdf|fleetco/plugins/PHPExcel)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/fleetco_error.log
    CustomLog ${APACHE_LOG_DIR}/fleetco_access.log combined
</VirtualHost>
