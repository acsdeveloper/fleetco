; FleetCo PHP configuration

upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
memory_limit = 256M
max_input_vars = 3000

; Suppress legacy deprecation notices in production
; Remove or set to E_ALL for development
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
