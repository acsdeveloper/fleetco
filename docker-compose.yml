services:
  app:
    build:
      context: .
      target: base
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/fleetco/fleetco/files
      - cache:/var/www/html/fleetco/fleetco/templates_c
    restart: unless-stopped

  app-dev:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: development
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: "client_host=host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html/fleetco
      - uploads:/var/www/html/fleetco/fleetco/files
      - cache:/var/www/html/fleetco/fleetco/templates_c
    profiles:
      - dev

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-fleetco}
      MYSQL_USER: ${DB_USER:-fleetco}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fleetco}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql.cnf:/etc/mysql/conf.d/fleetco.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  cache:
